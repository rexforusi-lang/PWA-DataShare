<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Google Drive PWA File Manager</title><link rel="stylesheet" href="./styles.css"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml"><meta name="theme-color" content="#2563eb"><script src="https://accounts.google.com/gsi/client" async defer></script><script src="./config.js"></script></head><body><header class="app-header"><div class="brand"><img src="./icons/icon-192.svg" class="brand-icon" alt="icon"><div><h1>Drive File Manager</h1><p>Google Drive PWA 檔案管理工具</p></div></div><div class="header-actions"><button id="loginBtn" class="btn primary">登入 Google</button><button id="restoreLoginBtn" class="btn secondary hidden">恢復登入</button><button id="logoutBtn" class="btn secondary hidden">登出</button></div></header><main class="container"><section class="status-panel"><span id="loginStatus">尚未登入</span><span id="clientIdStatus">尚未設定 OAuth Client ID</span><span id="folderStatus">尚未設定資料夾 ID</span></section><nav class="tabs"><button class="tab active" data-tab="files">File Manager</button><button class="tab" data-tab="settings">Settings</button></nav><section id="filesTab" class="tab-content active"><div class="toolbar"><div><h2>檔案列表</h2><p class="hint">支援多檔上傳、下載、改名、移到垃圾桶 / 永久刪除與批次操作。</p></div><div class="toolbar-actions"><input id="fileInput" type="file" multiple><button id="uploadBtn" class="btn primary">上傳檔案</button><button id="refreshBtn" class="btn secondary">重新整理</button></div></div><div id="batchActionBar" class="batch-bar hidden"><span id="selectedCountText">已選取 0 個檔案</span><button id="batchDeleteBtn" class="btn danger">批次刪除</button><button id="clearSelectionBtn" class="btn secondary">取消選取</button></div><div id="operationInfo" class="upload-info hidden"><div id="selectedFileInfo">尚未選擇檔案</div><div id="operationProgressText"></div><progress id="operationProgressBar" value="0" max="100"></progress></div><div id="messageBox" class="message hidden"></div><div class="desktop-table table-wrap"><table><thead><tr><th><input id="selectAllFilesCheckbox" type="checkbox"></th><th>檔案名稱</th><th>大小</th><th>副檔名</th><th>上傳者</th><th>上傳時間</th><th>操作</th></tr></thead><tbody id="fileTableBody"><tr><td colspan="7" class="empty">請先登入並設定資料夾 ID</td></tr></tbody></table></div><div id="mobileFileList" class="mobile-card-list"></div></section><section id="settingsTab" class="tab-content"><div class="settings-card"><h2>Settings</h2><p class="permission-note">V0.8 不會在頁面載入時自動開 Google popup。關閉後重開若需要登入，請點選「恢復登入」。</p><div class="version-grid"><div class="form-group"><label>目前版本</label><input id="currentVersion" readonly></div><div class="form-group"><label>PWA Cache</label><input id="cacheVersion" readonly></div><div class="form-group"><label>GitHub 最新版本</label><input id="githubLatestVersion" readonly placeholder="尚未檢查"></div></div><div class="form-group"><label>GitHub version.json URL</label><input id="versionUrlInput" placeholder="./version.json"></div><div class="form-group"><button id="checkUpdateBtn" class="btn secondary">檢查更新並自動套用</button><div id="updateResult" class="update-result hint"></div></div><div class="form-group"><label class="checkbox-label"><input id="rememberLoginInput" type="checkbox"> 記住登入狀態，重新開啟時顯示恢復登入</label><p id="lastLoginInfo" class="hint"></p></div><div class="form-group"><label>刪除模式</label><select id="deleteModeInput"><option value="trash">移到垃圾桶（建議）</option><option value="delete">永久刪除（需更高權限）</option></select></div><div class="form-group"><label>Google OAuth Client ID</label><input id="clientIdInput" placeholder="xxxxx.apps.googleusercontent.com"></div><div class="form-group"><label>Google Drive Folder ID</label><input id="folderIdInput" placeholder="Folder ID"></div><div class="settings-actions"><button id="saveSettingsBtn" class="btn primary">儲存設定</button><button id="clearSettingsBtn" class="btn danger">清除設定</button></div></div></section></main><footer class="app-footer">Google Drive PWA File Manager</footer><script src="./app.js"></script></body></html>
